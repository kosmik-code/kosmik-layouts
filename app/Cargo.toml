[package]
name = "kosmik-layouts"
version = "0.2.1"
description = "Per-game OBS layouts in one scene"
authors = ["Kosmik"]
license = "MIT"
repository = "https://github.com/kosmik-code/kosmik-layouts"
edition = "2024"
publish = false

[lib]
name = "kosmik_layouts"
path = "src/lib.rs"

[[bin]]
name = "kosmik-layouts"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = "0.26"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
include_dir = "0.7"
form_urlencoded = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
unicode-normalization = "0.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
